title: WheelSims
description: Documentation website

# Plugins
whitelist:
- jekyll-relative-links
plugins:
- jekyll-relative-links
- jekyll-remote-theme
- jekyll-awesome-nav
- jekyll-vitepress-theme

relative_links:
  enabled:     true
  collections: true

theme: jekyll-vitepress-theme

awesome_nav:
  enabled: true
  root: docs
  nav_filename: .nav.yml

defaults:
  - scope:
      path: "docs"
    values:
      layout: default
