title: WheelSims
description: Documentation website

# Plugins
whitelist:
- jekyll-relative-links
plugins:
- jekyll-relative-links
- jekyll-remote-theme
- jekyll-awesome-nav

relative_links:
  enabled:     true
  collections: true

remote_theme: pages-themes/cayman@v0.2.0

awesome_nav:
  enabled: true
  root: docs
  nav_filename: .nav.yml

defaults:
  - scope:
      path: "docs"
    values:
      layout: default
