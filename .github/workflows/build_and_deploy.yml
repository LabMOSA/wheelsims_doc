name: build_and_deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_and_deploy:
    defaults:
      run:
        shell: bash -l {0}
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    - name: Setup conda
      uses: conda-incubator/setup-miniconda@v4
      with:
        activate-environment: anaconda-client-env
    - name: Install dependencies
      run: |
        conda install -c conda-forge mystmd -y
    - name: Build website
      run: |
        cd docs
        export BASE_URL="/docs"
        myst build --execute --ci --html
        cd ..
    - name: Deploy via scp
      env:
        SCP_USER: ${{ secrets.SCP_USER }}
        SCP_HOST: ${{ secrets.SCP_HOST }}
        SCP_PORT: ${{ secrets.SCP_PORT }}
        SCP_KEY: ${{ secrets.SCP_KEY }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        echo "$SCP_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        SSH_OPTS="-o StrictHostKeyChecking=accept-new"
        rsync -a --delete-delay -e "ssh $SSH_OPTS -p $SCP_PORT" docs/_build/html $SCP_USER@$SCP_HOST:/home/wheelsim/docs_build
        
